<div class="container">

<h2>Contact & Reservations</h2>

<form id="bookingForm">

<label for="name">Name</label>
<input type="text" id="name" required>

<label for="email">Email</label>
<input type="email" id="email" required>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" required>

<label for="date">Reservation Date</label>
<input type="date" id="date" required>

<label for="guests">Guests</label>
<input type="number" id="guests" min="1" max="20">

<label for="message">Message</label>
<textarea id="message" rows="5"></textarea>

<button type="submit">
Submit Reservation Request
</button>

</form>

<br>

<h3>Privacy Notice</h3>

<p>
Information submitted through this form will only be used for booking
and enquiry purposes. Information is not shared with third parties.
